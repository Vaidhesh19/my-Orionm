<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orian Voice Dialer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f4f7f6;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #555;
        }
        #transcript {
            margin-top: 10px;
            font-style: italic;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Orian Voice Assistant</h2>
    <p>Tap the button and say: <br><strong>"Orian call [Contact Name]"</strong></p>
    
    <button id="start-btn">Activate Orian</button>
    <div id="status">Status: Ready</div>
    <div id="transcript"></div>
</div>

<script>
    // 1. DEFINE YOUR CONTACTS HERE
    // Format: "name in lowercase": "phone number"
    const myContacts = {
        "john doe": "+1234567890",
        "jane smith": "+0987654321",
        "mom": "+1122334455"
    };

    const startBtn = document.getElementById('start-btn');
    const statusDiv = document.getElementById('status');
    const transcriptDiv = document.getElementById('transcript');

    // 2. CHECK FOR WEB SPEECH API SUPPORT
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        statusDiv.textContent = "Error: Your browser does not support voice recognition.";
        startBtn.disabled = true;
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        startBtn.addEventListener('click', () => {
            recognition.start();
            statusDiv.textContent = "Listening...";
            transcriptDiv.textContent = "";
        });

        recognition.onresult = (event) => {
            const speechResult = event.results[0][0].transcript.toLowerCase().trim();
            transcriptDiv.textContent = `You said: "${speechResult}"`;

            // 3. PARSE THE COMMAND ("orian call [name]")
            const trigger = "orian call";
            
            if (speechResult.startsWith(trigger)) {
                // Extract the contact name after "orian call "
                const contactName = speechResult.replace(trigger, "").trim();
                
                if (myContacts[contactName]) {
                    statusDiv.textContent = `Calling ${contactName}...`;
                    // Redirect to the system phone dialer
                    window.location.href = `tel:${myContacts[contactName]}`;
                } else {
                    statusDiv.textContent = `Contact "${contactName}" not found in your list.`;
                }
            } else {
                statusDiv.textContent = "Command not recognized. Try saying 'Orian call...'";
            }
        };

        recognition.onspeechend = () => {
            recognition.stop();
        };

        recognition.onerror = (event) => {
            statusDiv.textContent = `Error occurred: ${event.error}`;
        };
    }
</script>

</body>
</html>
