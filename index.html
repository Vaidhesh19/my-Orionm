<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion Voice Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 25px; border: none; background-color: #007bff; color: white; margin: 10px; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 20px; font-size: 20px; font-weight: bold; color: #333; }
        #transcript { margin-top: 10px; font-style: italic; color: #666; }
    </style>
</head>
<body>

    <h1>🎤 Orion Voice Assistant</h1>
    <button onclick="syncContacts()">1. Sync Contacts First</button>
    <button onclick="startListening()">2. Speak Command</button>
    
    <div id="status">Click "Sync Contacts" to begin.</div>
    <div id="transcript"></div>

<script>
    // Global variable to temporarily hold contacts in browser memory
    let localContacts = [];

    // 1. TEXT-TO-SPEECH (Orion Replies)
    function orionSpeak(text) {
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'en-US';
        window.speechSynthesis.speak(speech);
        document.getElementById('status').innerText = text;
    }

    // 2. CONTACT PICKER API (Access phone book)
    async function syncContacts() {
        if ('contacts' in navigator && 'ContactsManager' in window) {
            try {
                // Requesting only Name and Phone number fields
                const props = ['name', 'tel'];
                const opts = { multiple: true };
                
                document.getElementById('status').innerText = "Opening contact picker...";
                localContacts = await navigator.contacts.select(props, opts);
                
                orionSpeak(`Successfully synced ${localContacts.length} contacts.`);
            } catch (err) {
                document.getElementById('status').innerText = "Sync cancelled or failed: " + err.message;
            }
        } else {
            orionSpeak("Sorry, your device browser does not support local contact syncing.");
        }
    }

    // 3. SPEECH RECOGNITION (Voice Commands)
    function startListening() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            orionSpeak("Your browser does not support voice recognition.");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        document.getElementById('status').innerText = "Listening for 'Orion...'";
        recognition.start();

        recognition.onresult = function(event) {
            let command = event.results[0][0].transcript.toLowerCase().trim();
            document.getElementById('transcript').innerText = `You said: "${command}"`;
            processCommand(command);
        };

        recognition.onerror = function(event) {
            document.getElementById('status').innerText = "Error occurred: " + event.error;
        };
    }

    // 4. COMMAND PARSING & ACTIONS
    function processCommand(voiceText) {
        // Enforce the wake word "orion"
        if (!voiceText.startsWith('orion')) {
            orionSpeak("Please start your command with the wake word Orion.");
            return;
        }

        // Clean command by dropping the wake word
        let actionText = voiceText.replace('orion', '').trim();

        // --- COMMAND: CALL CONTACT ---
        if (actionText.startsWith('call')) {
            let targetName = actionText.replace('call', '').trim();
            
            // Find contact in our synced list
            let foundContact = localContacts.find(c => c.name.toString().toLowerCase().includes(targetName));

            if (foundContact && foundContact.tel && foundContact.tel.length > 0) {
                let phoneNumber = foundContact.tel[0];
                orionSpeak(`Calling ${foundContact.name}`);
                
                // Triggers native mobile dialer
                setTimeout(() => {
                    window.location.href = `tel:${phoneNumber}`;
                }, 1500);
            } else {
                orionSpeak(`Sorry, I couldn't find ${targetName} in your synced list.`);
            }
        } 
        
        // --- COMMAND: YOUTUBE MUSIC ---
        else if (actionText.startsWith('play music') || actionText.startsWith('play song')) {
            let songQuery = actionText.replace(/play music|play song/, '').trim();
            orionSpeak(`Searching for ${songQuery} on YouTube Music.`);
            
            setTimeout(() => {
                // Deep link scheme opens YouTube Music app directly
                window.location.href = `https://youtube.com{encodeURIComponent(songQuery)}`;
            }, 1500);
        } 
        
        // --- COMMAND: GOOGLE SEARCH / YOUTUBE VIDEO ---
        else if (actionText.startsWith('play')) {
            let videoQuery = actionText.replace('play', '').trim();
            orionSpeak(`Playing ${videoQuery} on YouTube.`);
            
            setTimeout(() => {
                // Deep link opens native YouTube app or website
                window.location.href = `https://youtube.com{encodeURIComponent(videoQuery)}`;
            }, 1500);
        } else if (actionText.startsWith('search')) {
            let searchQuery = actionText.replace('search', '').trim();
            orionSpeak(`Searching Google for ${searchQuery}`);
            
            setTimeout(() => {
                window.location.href = `https://google.com{encodeURIComponent(searchQuery)}`;
            }, 1500);
        }
        
        // --- FALLBACK ---
        else {
            orionSpeak("Command not recognized. Try saying Orion call, Orion play, or Orion search.");
        }
    }
</script>

</body>
</html>
